<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z - Pesquisa Geral</title>
<script>
async function pesquisarTudo(pergunta){
  const q = pergunta.toLowerCase().trim();

  // 1. TEMPERATURA QUALQUER CIDADE DO MUNDO
  if(q.includes("temperatura") || q.includes("clima") || q.includes("tempo agora")){
    try{
      let cidade = "Vitoria da Conquista";
      // pega o que vier depois do "em"
      let match = pergunta.match(/em\s+([^?.,]+)/i);
      if(match) cidade = match[1].replace(/agora/gi,"").trim();
      // wttr aceita Boston, Tokyo, tudo
      const r = await fetch(`https://wttr.in/${encodeURIComponent(cidade)}?format=j1`);
      const j = await r.json();
      const a = j.current_condition[0];
      return `🌡️ Agora em ${cidade}: ${a.temp_C}°C (sensação ${a.FeelsLikeC}°C), ${a.weatherDesc[0].value}, umidade ${a.humidity}%, vento ${a.windspeedKmph}km/h`;
    }catch(e){ return `Não achei clima de ${pergunta}, tenta "temperatura em Boston"`; }
  }

  // 2. DÓLAR
  if(q.includes("dolar") || q.includes("dólar")){
    try{
      const r = await fetch("https://economia.awesomeapi.com.br/last/USD-BRL");
      const j = await r.json();
      return `💵 Dólar hoje: R$ ${parseFloat(j.USDBRL.bid).toFixed(2)} - variação ${j.USDBRL.pctChange}%`;
    }catch(e){}
  }

  // 3. PESQUISA GERAL - WIKIPEDIA + DUCKDUCKGO (QUALQUER COISA)
  try{
    // tenta wikipedia pt
    let termo = pergunta.replace(/o que é|quem é|quem foi|me explica|pesquisa/gi,"").trim();
    let r = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(termo)}`);
    if(r.ok){
      let j = await r.json();
      if(j.extract) return `📚 ${j.title}: ${j.extract}`;
    }
    // tenta wikipedia en
    r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(termo)}`);
    if(r.ok){
      let j = await r.json();
      if(j.extract) return `📚 ${j.title}: ${j.extract}`;
    }
    // tenta duckduckgo
    r = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(pergunta)}&format=json&pretty=1`);
    let j = await r.json();
    if(j.AbstractText) return `🌐 ${j.AbstractText}`;
    if(j.RelatedTopics && j.RelatedTopics[0] && j.RelatedTopics[0].Text) return `🌐 ${j.RelatedTopics[0].Text}`;

    return `Pesquisei sobre "${termo}" mas não achei resumo rápido. Tenta perguntar de outro jeito, tipo "quem foi Einstein"`;
  }catch(e){
    return `Pesquisei "${pergunta}" - deu erro de conexão, tenta de novo!`;
  }
}

function addMsg(t,quem){
  const c=document.getElementById('chat');
  const d=document.createElement('div'); d.className=quem; d.innerText=t;
  c.appendChild(d); c.scrollTop=c.scrollHeight; return d;
}

window.enviar=async()=>{
  const inp=document.getElementById('input'); let txt=inp.value.trim(); if(!txt) return;
  addMsg(txt,'me'); inp.value='';
  const load=addMsg("🔍 Pesquisando na internet igual Meta AI...",'z');

  let resposta = await pesquisarTudo(txt);
  load.innerText = resposta;

  // imagem se pedir
  if(txt.toLowerCase().match(/imagem|cria|desenha|foto/)){
    let p = txt.replace(/cria|imagem|desenha/gi,"").trim() || "cute";
    const img=document.createElement('img');
    img.src=`https://image.pollinations.ai/prompt/${encodeURIComponent(p+", pixar 3d")}?width=1024&height=1024&seed=${Date.now()}&nologo=true`;
    img.style="width:85%;border-radius:15px;margin:8px;border:2px solid #25D366;display:block";
    document.getElementById('chat').appendChild(img);
  }
  try{ speechSynthesis.speak(new SpeechSynthesisUtterance(resposta.slice(0,180))); }catch(e){}
};

let rec;
window.startRec=()=>{
  document.getElementById('grav').style.display='flex';
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return;
  rec=new SR(); rec.lang='pt-BR'; rec.start();
  rec.onresult=e=>{document.getElementById('input').value=e.results[0][0].transcript; stopRec(); enviar();};
};
window.stopRec=()=>{document.getElementById('grav').style.display='none'; if(rec)try{rec.stop()}catch(e){}};
</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b141a;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
#top{background:#25D366;text-align:center;padding:10px;font-weight:bold}
#chat{flex:1;overflow:auto;padding:15px 10px 85px;display:flex;flex-direction:column;gap:8px;background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}
.me{align-self:flex-end;background:#005c4b;padding:10px 14px;border-radius:12px 0 12px 12px;max-width:82%}
.z{align-self:flex-start;background:#202c33;padding:10px 14px;border-radius:0 12px 12px 12px;max-width:82%;white-space:pre-wrap;line-height:1.4}
#barra{position:fixed;bottom:0;width:100%;background:#202c33;display:flex;gap:8px;padding:10px}
#input{flex:1;padding:13px 18px;border-radius:25px;border:none;background:#2a3942;color:white;outline:none;font-size:16px}
.btn{width:48px;height:48px;border-radius:50%;border:none;background:#25D366;color:white;font-size:20px}
#grav{display:none;position:fixed;bottom:70px;width:100%;background:#f15c6d;padding:12px;justify-content:center;z-index:10}
</style>
</head>
<body>
<div id="top">✅ Z Online - Pesquisa Geral Igual Meta AI</div>
<div id="grav">🔴 Ouvindo... <button onclick="stopRec()">X</button></div>
<div id="chat"><div class="z">Pronta! Agora geral! 🐻

Testa qualquer coisa:
- Qual temperatura em Boston agora
- Quem foi Albert Einstein
- O que é buraco negro
- Quanto está o dólar hoje
- Cria imagem do Ben

Não tô mais limitada!</div></div>
<div id="barra">
<input id="input" placeholder="Pesquise qualquer coisa..." onkeydown="if(event.key==='Enter')enviar()">
<button class="btn" onmousedown="startRec()" onmouseup="stopRec()" ontouchstart="startRec()" ontouchend="stopRec()">🎤</button>
<button class="btn" onclick="enviar()">➤</button>
</div>
</body>
</html>
