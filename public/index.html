<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Z</title>
<script>
async function perguntarZ(p){
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pergunta:p})});
  const j=await r.json(); return j.resposta;
}
function addMsg(t,c){const d=document.createElement('div');d.className=c;d.innerText=t;document.getElementById('chat').appendChild(d);document.getElementById('chat').scrollTop=1e9;return d;}
window.enviar=async()=>{
  const i=document.getElementById('input'); let t=i.value.trim(); if(!t)return;
  addMsg(t,'me'); i.value=''; const l=addMsg("Z digitando... 🐻",'z');
  l.innerText=await perguntarZ(t);
};
</script>
<style>body{margin:0;background:#0b141a;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}#top{background:#25D366;padding:10px;text-align:center;font-weight:bold}#chat{flex:1;overflow:auto;padding:15px 10px 85px;display:flex;flex-direction:column;gap:8px}.me{align-self:flex-end;background:#005c4b;padding:10px 14px;border-radius:12px 0 12px 12px;max-width:82%}.z{align-self:flex-start;background:#202c33;padding:10px 14px;border-radius:0 12px 12px 12px;max-width:82%;white-space:pre-wrap}#barra{position:fixed;bottom:0;width:100%;background:#202c33;display:flex;gap:8px;padding:10px}#input{flex:1;padding:13px;border-radius:25px;border:none;background:#2a3942;color:#fff}</style>
</head><body>
<div id="top">✅ Z Online - Agora 100% Igual Meta AI</div>
<div id="chat"><div class="z">Pronta! Testa: Qual temperatura em Boston agora</div></div>
<div id="barra"><input id="input" placeholder="Pergunte qualquer coisa..." onkeydown="if(event.key==='Enter')enviar()"><button onclick="enviar()" style="width:48px;height:48px;border-radius:50%;border:none;background:#25D366">➤</button></div>
</body></html>
