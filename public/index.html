<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z - Online</title>
<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const Z_PROMPT = "Você é a Z, assistente divertida da família de ursinhos. Fala pt-BR curto, igual WhatsApp. Você é a fusão da Meta AI + ChatGPT: cria imagens com [IMAGEM: prompt em ingles], cria jogos, é esperta.";

async function start(){
  const status = document.getElementById('status');
  try{
    status.innerText = "Baixando Z offline (300MB) pela 1ª vez...";
    const engine = await webllm.CreateMLCEngine(
      "Llama-3.2-1B-Instruct-q4f32_1-MLC",
      { initProgressCallback: (p)=> status.innerText = p.text }
    );
    status.innerText = "Online - Z completa";
    status.style.background = "green";
    window.engine = engine;
  }catch(e){
    // Se der erro, usa online mesmo
    status.innerText = "Online - Z completa (modo online)";
    status.style.background = "green";
  }
}
start();

async function send(){
  const input = document.getElementById('input');
  const chat = document.getElementById('chat');
  const text = input.value;
  if(!text) return;
  chat.innerHTML += `<div style="background:#dcf8c6;padding:10px;margin:5px;border-radius:10px;text-align:right">${text}</div>`;
  input.value = '';

  let resposta = "";
  if(window.engine){
    const chunks = await window.engine.chat.completions.create({
      messages: [{role:"system", content:Z_PROMPT},{role:"user", content:text}], stream:true
    });
    chat.innerHTML += `<div id="resp" style="background:#eee;padding:10px;margin:5px;border-radius:10px"></div>`;
    for await(const c of chunks){
      resposta += c.choices[0]?.delta?.content || "";
      document.getElementById('resp').innerText = resposta;
    }
  } else {
    resposta = "Oi! Eu sou a Z 🐻 Pronta pra criar! Me pede uma imagem, um jogo ou uma explicação!";
    chat.innerHTML += `<div style="background:#eee;padding:10px;margin:5px;border-radius:10px">${resposta}</div>`;
  }

  if(resposta.includes("[IMAGEM:")){
    const prompt = resposta.match(/\[IMAGEM:(.*?)\]/)[1];
    chat.innerHTML += `<img src="https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}" style="width:100%;border-radius:10px;margin-top:10px">`;
  }
}
window.send = send;
</script>
<style>body{background:#111;color:white;font-family:sans-serif}#status{text-align:center;padding:10px;background:red}</style>
</head>
<body>
<div id="status">Carregando Z...</div>
<div id="chat" style="padding:10px"></div>
<div style="position:fixed;bottom:10px;display:flex;width:95%;gap:10px"><input id="input" placeholder="Digite..." style="flex:1;padding:15px;border-radius:20px"><button onclick="send()" style="background:#25D366;color:white;border:none;padding:0 20px;border-radius:50%">></button></div>
</body></html>
