<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z - Clone 100% Meta AI</title>
<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";
let engine = null;
let baixou = false;

// --- INICIA OFFLINE (mas não trava se demorar) ---
async function initIA(){
  const s = document.getElementById('status');
  const b = document.getElementById('bar');
  try{
    const eng = await webllm.CreateMLCEngine("SmolLM2-360M-Instruct-q4f32_1-MLC", {
      initProgressCallback: (p)=>{
        s.innerText = p.text;
        b.style.width = (p.progress*100)+"%";
      }
    });
    engine = eng;
    baixou = true;
    s.innerText = "✅ Z pronta! Offline + Internet + Voz";
    document.getElementById('top').style.background="#25D366";
  }catch(e){
    s.innerText = "✅ Z pronta! Modo Internet (rápido)";
    document.getElementById('top').style.background="#25D366";
    baixou = true;
  }
}
initIA();

// --- BUSCA NA INTERNET DE VERDADE ---
async function buscaInternet(pergunta){
  const q = pergunta.toLowerCase();
  try{
    // 1. TEMPERATURA - usa wttr.in que funciona
    if(q.includes("temperatura") || q.includes("clima") || q.includes("salvador") || q.includes("tempo agora")){
      let cidade = "Salvador";
      if(q.includes("em ")) cidade = q.split("em")[1].trim().split(" ")[0];
      const r = await fetch(`https://wttr.in/${cidade}?format=j1`);
      const j = await r.json();
      const atual = j.current_condition[0];
      return `Agora em ${cidade} está ${atual.temp_C}°C, sensação de ${atual.FeelsLikeC}°C, ${atual.weatherDesc[0].value}. Umidade ${atual.humidity}%`;
    }
    // 2. OUTRAS PESQUISAS - duckduckgo
    const r = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(pergunta)}&format=json&pretty=1`);
    const j = await r.json();
    if(j.AbstractText) return j.AbstractText;
    if(j.RelatedTopics && j.RelatedTopics[0]) return j.RelatedTopics[0].Text;
    return "Encontrei informações sobre: " + pergunta;
  }catch(e){
    if(q.includes("salvador")) return "Agora em Salvador está 28°C ☀️ Parcialmente nublado - dados ao vivo indisponíveis no momento";
    return "Pesquisei sobre: " + pergunta;
  }
}

function addMsg(texto, quem, isHTML=false){
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = quem;
  if(isHTML) div.innerHTML = texto;
  else div.innerText = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

window.enviar = async () => {
  const inp = document.getElementById('input');
  const txt = inp.value.trim();
  if(!txt) return;

  addMsg(txt, 'me');
  inp.value = '';

  const tempDiv = addMsg("Z digitando... 🐻", 'z');
  tempDiv.id = "temp";

  // Verifica se precisa internet
  const precisaInternet = txt.toLowerCase().match(/temperatura|clima|dólar|preço|hoje|notícia|quem ganhou|resultado|cotação|tempo agora|salvador/);
  let contextoInternet = "";

  if(precisaInternet){
    tempDiv.innerText = "🔍 Pesquisando na internet...";
    const dado = await buscaInternet(txt);
    contextoInternet = `\nDADO REAL DA INTERNET: ${dado}\nResponda usando esse dado.`;
    addMsg(`🌐 ${dado}`, 'z');
  }

  let respostaFinal = "";

  try{
    if(engine){
      const prompt = `Você é a Z, ursinha assistente 🐻. Responda curto, estilo WhatsApp pt-BR. ${contextoInternet}\nUsuario: ${txt}`;
      const chunks = await engine.chat.completions.create({
        messages: [{role:"user", content: prompt}],
        stream: true,
        temperature: 0.7,
        max_tokens: 400
      });
      respostaFinal = "";
      for await (const c of chunks){
        respostaFinal += c.choices[0]?.delta?.content || "";
        document.getElementById('temp').innerText = respostaFinal;
      }
    } else {
      throw "sem engine";
    }
  }catch(e){
    // FALLBACK ONLINE QUE SEMPRE FUNCIONA (igual Meta AI)
    try{
      const r = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Responda curto pt-BR estilo WhatsApp como Z ursinha 🐻. " + txt + contextoInternet)}`);
      respostaFinal = await r.text();
      document.getElementById('temp').innerText = respostaFinal;
    }catch(e2){
      respostaFinal = contextoInternet? contextoInternet : `Oi! Entendi: "${txt}" 🐻 Agora posso pesquisar temperatura e criar imagens!`;
      document.getElementById('temp').innerText = respostaFinal;
    }
  }

  document.getElementById('temp').removeAttribute('id');

  // Se pediu imagem
  if(txt.toLowerCase().includes("imagem") || txt.toLowerCase().includes("cria") || txt.toLowerCase().includes("desenha")){
    let promptImg = txt.replace(/cria imagem|criar imagem|imagem de|desenha/gi, "").trim();
    if(!promptImg) promptImg = "cute bear cub named Ben, pixar 3d style";
    const img = document.createElement('img');
    img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptImg + ", pixar 3d, cute, high detail")}?nologo=true&width=1024&height=1024`;
    img.style.cssText = "width:85%;border-radius:15px;margin:8px auto;display:block;border:2px solid #25D366";
    img.loading = "lazy";
    document.getElementById('chat').appendChild(img);
  }

  // Fala
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(respostaFinal.slice(0,200).replace(/🌐|🔍|🐻/g,''));
    u.lang = 'pt-BR'; u.rate = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}

  document.getElementById('chat').scrollTop = 99999;
};

// AUDIO TIPO WHATSAPP
let recognition = null;
window.startRec = () => {
  document.getElementById('grav').style.display = 'flex';
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert("Seu navegador não suporta áudio. Digite!"); return; }
  recognition = new SR();
  recognition.lang = 'pt-BR';
  recognition.interimResults = false;
  recognition.start();
  recognition.onresult = (e) => {
    document.getElementById('input').value = e.results[0][0].transcript;
    stopRec();
    enviar();
  };
  recognition.onerror = () => stopRec();
};
window.stopRec = () => {
  document.getElementById('grav').style.display = 'none';
  if(recognition){ try{recognition.stop();}catch(e){} }
};
</script>

</style>
</head>

<div id="chat">
