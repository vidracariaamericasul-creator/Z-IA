<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z WhatsApp</title>
<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";
let engine, recorder, audioChunks=[];
const Z_PROMPT="Você é a Z, ursinha assistente da família Ben. Fala pt-BR curto estilo WhatsApp. Quando pedir imagem, responde com [IMAGEM: prompt em ingles detalhado]";
async function init(){
  const s=document.getElementById('status');
  try{
    const eng=await webllm.CreateMLCEngine("Llama-3.2-1B-Instruct-q4f32_1-MLC",{initProgressCallback:p=>s.innerText=p.text});
    engine=eng; s.innerText="Z online - pode falar"; s.style.background="#25D366";
  }catch(e){ s.innerText="Z online (modo rápido)"; s.style.background="#25D366"; }
}
init();
window.send=async()=>{
  const inp=document.getElementById('input'); const txt=inp.value; if(!txt) return;
  addMsg(txt,'me'); inp.value=''; let resp="";
  const box=addMsg("Z digitando...","z"); box.id="resp";
  if(engine){
    const c=await engine.chat.completions.create({messages:[{role:"system",content:Z_PROMPT},{role:"user",content:txt}],stream:true});
    resp=""; for await(const ch of c){resp+=ch.choices[0]?.delta?.content||""; document.getElementById('resp').innerText=resp;}
  } else { resp="Oi! Sou a Z 🐻 Pronta! Me pede imagem ou jogo do Ben!"; document.getElementById('resp').innerText=resp; }
  if(resp.includes("[IMAGEM:")){
    const p=resp.match(/\[IMAGEM:(.*?)\]/)[1];
    document.getElementById('chat').innerHTML+=`<img src="https://image.pollinations.ai/prompt/${encodeURIComponent(p)}" style="width:90%;border-radius:15px;margin:10px">`;
  }
};
function addMsg(t,who){
  const d=document.createElement('div'); d.innerText=t;
  d.style.cssText=who=='me'?'background:#dcf8c6;align-self:flex-end;padding:10px;margin:5px;border-radius:15px 0 15px 15px;max-width:80%':'background:white;color:black;padding:10px;margin:5px;border-radius:0 15px 15px 15px;max-width:80%';
  document.getElementById('chat').appendChild(d); return d;
}
window.startRec=async()=>{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  recorder=new MediaRecorder(stream); audioChunks=[]; recorder.ondataavailable=e=>audioChunks.push(e.data);
  recorder.onstop=async()=>{
    const blob=new Blob(audioChunks,{type:'audio/webm'});
    const rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
    // fallback: usa Web Speech com áudio gravado via API se tiver
    document.getElementById('status').innerText="Transcrevendo áudio...";
    // Se o navegador não transcrever o blob, usa o microfone direto na próxima
    const r2=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
    r2.lang='pt-BR'; r2.start(); r2.onresult=e=>{
      document.getElementById('input').value=e.results[0][0].transcript; window.send();
      document.getElementById('status').innerText="Z online - pode falar";
    };
  };
  recorder.start(); document.getElementById('recInfo').style.display='block';
};
window.stopRec=()=>{ if(recorder){recorder.stop(); document.getElementById('recInfo').style.display='none';} };
</script>
<style>body{margin:0;background:#111b21;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}#status{text-align:center;padding:8px;color:white;background:#202c33;font-size:13px}#chat{flex:1;overflow:auto;display:flex;flex-direction:column;padding:10px;background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}#bar{display:flex;align-items:center;padding:10px;background:#202c33;gap:8px}#input{flex:1;padding:12px 18px;border-radius:25px;border:none;outline:none}#mic{width:50px;height:50px;border-radius:50%;background:#25D366;border:none;color:white;font-size:22px}#recInfo{display:none;color:#f15c6d;text-align:center;padding:5px}</style>
</head>
<body>
<div id="status">Baixando Z offline (1ª vez 7%)...</div>
<div id="recInfo">🔴 Gravando... solte para enviar</div>
<div id="chat"></div>
<div id="bar">
<input id="input" placeholder="Mensagem">
<button id="mic" onmousedown="startRec()" onmouseup="stopRec()" ontouchstart="startRec()" ontouchend="stopRec()">🎤</button>
<button onclick="send()" style="width:50px;height:50px;border-radius:50%;background:#25D366;border:none;color:white;font-size:20px">></button>
</div>
</body></html>
