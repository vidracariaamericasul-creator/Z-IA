<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z - Clone Meta AI</title>
<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";
let engine=null;
const SYSTEM=`Você é a Z, clone da Meta AI. Fala pt-BR curto, estilo WhatsApp com 🐻.
Quando pedir IMAGEM responda com [IMAGEM: prompt em ingles detalhado pixar 3d].
Quando pedir JOGO responda com [JOGO]codigo html completo[/JOGO].
Quando precisar de internet, diga [PESQUISAR: termo].`;

async function init(){
  const s=document.getElementById('status');
  try{
    const eng=await webllm.CreateMLCEngine("Llama-3.2-1B-Instruct-q4f32_1-MLC",{
      initProgressCallback:p=>{s.innerText=p.text; document.getElementById('bar').style.width=p.progress*100+"%"}
    });
    engine=eng; s.innerText="Z online - Offline + Internet + Voz";
    document.getElementById('top').style.background="#25D366";
  }catch(e){ s.innerText="Z online - Modo Internet"; document.getElementById('top').style.background="#25D366"; }
}
init();

async function buscarInternet(termo){
  try{
    const r=await fetch(`/api/search?q=${encodeURIComponent(termo)}`);
    const j=await r.json(); return j.resposta;
  }catch(e){
    const r=await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(termo)}&format=json`);
    const j=await r.json(); return j.AbstractText || "Encontrei: "+termo;
  }
}
async function chatOnline(prompt){
  try{
    const r=await fetch(`/api/chat?prompt=${encodeURIComponent(prompt)}`);
    const j=await r.json(); return j.text;
  }catch(e){ return null; }
}

window.enviar=async()=>{
  const inp=document.getElementById('input'); let txt=inp.value.trim(); if(!txt) return;
  addMsg(txt,'me'); inp.value='';
  const box=addMsg("Z pensando... 🐻",'z'); box.id="temp";

  let resposta="";
  let contextoExtra="";

  // Se pediu internet
  if(txt.toLowerCase().match(/pesquis|internet|hoje|notícia|preço|quem ganhou|resultado/)){
    addMsg("🔍 Pesquisando na internet igual a Meta AI...",'z');
    const info=await buscarInternet(txt);
    contextoExtra=`\nINFORMAÇÃO DA INTERNET: ${info}\nUse isso para responder.`;
  }

  if(engine){
    const chunks=await engine.chat.completions.create({
      messages:[{role:"system",content:SYSTEM},{role:"user",content:txt+contextoExtra}],
      stream:true, temperature:0.8
    });
    resposta=""; for await(const c of chunks){resposta+=c.choices[0]?.delta?.content||""; document.getElementById('temp').innerText=resposta;}
    document.getElementById('temp').removeAttribute('id');
    renderExtras(resposta);
  }else{
    const online=await chatOnline(SYSTEM+"\nUsuario:"+txt+contextoExtra);
    resposta=online||`Entendi! ${txt} 🐻 Me pede imagem ou jogo! [IMAGEM: cute bear cub named Ben, pixar style]`;
    document.getElementById('temp').innerText=resposta;
    document.getElementById('temp').removeAttribute('id');
    renderExtras(resposta);
  }
  falar(resposta);
};

function renderExtras(texto){
  const chat=document.getElementById('chat');
  if(texto.includes("[IMAGEM:")){
    const p=texto.match(/\[IMAGEM:(.*?)\]/)[1];
    const img=document.createElement('img');
    img.src=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=1024&nologo=1`;
    img.style.cssText="width:85%;border-radius:15px;margin:8px;border:2px solid #25D366";
    chat.appendChild(img);
  }
  if(texto.includes("[PESQUISAR:")){
    const t=texto.match(/\[PESQUISAR:(.*?)\]/)[1];
    buscarInternet(t).then(info=>addMsg(`🌐 Resultado da internet: ${info}`,'z'));
  }
}

function addMsg(t,quem){
  const d=document.createElement('div'); d.className=quem; d.innerText=t.replace(/\[IMAGEM:.*?\]|\[PESQUISAR:.*?\]|\[JOGO\][\s\S]*?\[\/JOGO\]/g,'').trim();
  document.getElementById('chat').appendChild(d);
  document.getElementById('chat').scrollTop=99999; return d;
}

// AUDIO WHATSAPP
let rec;
window.startRec=()=>{
  document.getElementById('grav').style.display='flex';
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return;
  rec=new SR(); rec.lang='pt-BR'; rec.start();
  rec.onresult=e=>{document.getElementById('input').value=e.results[0][0].transcript; stopRec(); enviar();}
};
window.stopRec=()=>{document.getElementById('grav').style.display='none'; if(rec) rec.stop();};
function falar(txt){
  try{
    const clean=txt.replace(/\[.*?\]/g,'').slice(0,250);
    const u=new SpeechSynthesisUtterance(clean); u.lang='pt-BR'; u.rate=1.05; speechSynthesis.speak(u);
  }catch(e){}
}
</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b141a;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
#top{position:fixed;top:0;width:100%;z-index:9;background:#202c33}#bar{height:4px;background:#25D366;width:0%}#status{text-align:center;padding:8px;font-size:13px}
#chat{flex:1;overflow:auto;padding:80px 12px 90px;display:flex;flex-direction:column;gap:6px;background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}
.me{align-self:flex-end;background:#005c4b;padding:10px 14px;border-radius:12px 0 12px 12px;max-width:82%}
.z{align-self:flex-start;background:#202c33;padding:10px 14px;border-radius:0 12px 12px 12px;max-width:82%}
#barra{position:fixed;bottom:0;width:100%;background:#202c33;display:flex;gap:8px;padding:10px;align-items:center}
#input{flex:1;padding:13px 18px;border-radius:25px;border:none;background:#2a3942;color:white;outline:none;font-size:16px}
.btn{width:48px;height:48px;border-radius:50%;border:none;background:#25D366;color:white;font-size:20px}
#grav{display:none;position:fixed;bottom:75px;width:100%;background:#f15c6d;padding:12px;justify-content:center}
</style>
</head>
<body>
<div id="top"><div id="bar"></div><div id="status">Iniciando Z igual Meta AI... Baixando offline</div></div>
<div id="grav">🔴 Ouvindo... solte para enviar <button onclick="stopRec()" style="margin-left:15px">Cancelar</button></div>
<div id="chat"><div class="z">Oi! Sou a Z 🐻 Clone da Meta AI completo!\n\n✅ Crio imagens\n✅ Acesso internet\n✅ Ouço áudio (segura o 🎤)\n✅ Falo igual ChatGPT\n✅ Funciono offline\n\nTesta: "pesquisa preço do dólar hoje" ou "cria imagem do Ben"</div></div>
<div id="barra">
<input id="input" placeholder="Pergunte igual pro Meta AI..." onkeydown="if(event.key==='Enter')enviar()">
<button class="btn" onmousedown="startRec()" onmouseup="stopRec()" ontouchstart="startRec()" ontouchend="stopRec()">🎤</button>
<button class="btn" onclick="enviar()">➤</button>
</div>
</body>
</html>
