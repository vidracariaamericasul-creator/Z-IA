<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z - Sua IA pessoal</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: white; height: 100vh; }
       .app { height: 100vh; display: flex; flex-direction: column; }
        header { padding: 18px; text-align: center; border-bottom: 1px solid #334155; font-size: 24px; font-weight: bold; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; }
       .message { margin-bottom: 14px; padding: 12px 15px; border-radius: 14px; max-width: 85%; white-space: pre-wrap; line-height: 1.5; }
       .user { margin-left: auto; background: #2563eb; }
       .assistant { margin-right: auto; background: #1e293b; }
       .input-area { display: flex; gap: 10px; padding: 15px; border-top: 1px solid #334155; align-items: center; }
        input { flex: 1; padding: 14px; border: none; border-radius: 25px; font-size: 16px; outline: none; }
        #send, #mic { width: 50px; height: 50px; border: none; border-radius: 50%; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #send { background: #2563eb; color: white; display: none; }
        #mic { background: #2563eb; color: white; }
        #mic.listening { background: #ef4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
       .recording-status { text-align: center; font-size: 12px; color: #94a3b8; height: 14px; margin-bottom: 4px;}
    </style>
</head>
<body>
    <div class="app">
        <header>Z</header>
        <div id="chat"></div>
        <div class="recording-status" id="status"></div>
        <div class="input-area">
            <input id="message" type="text" placeholder="Digite sua mensagem..." autocomplete="off">
            <button id="mic">🎤</button>
            <button id="send">➤</button>
        </div>
    </div>
<script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const mic = document.getElementById("mic");
    const statusEl = document.getElementById("status");
    const history = [];

    function addMessage(text, role) {
        const div = document.createElement("div");
        div.className = "message " + role;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    // Troca mic / enviar
    input.addEventListener("input", () => {
        if (input.value.trim()) {
            mic.style.display = "none";
            send.style.display = "flex";
        } else {
            mic.style.display = "flex";
            send.style.display = "none";
        }
    });

    async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;
        addMessage(message, "user");
        history.push({ role: "user", content: message });
        input.value = "";
        mic.style.display = "flex";
        send.style.display = "none";
        send.disabled = true;
        try {
            const response = await fetch(window.location.origin + "/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message, history: history })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || "Erro ao conversar com a Z.");
            addMessage(data.reply, "assistant");
            history.push({ role: "assistant", content: data.reply });
        } catch (error) {
            addMessage("Erro: " + error.message, "assistant");
        }
        send.disabled = false;
        input.focus();
    }

    send.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

    // --- MICROFONE ESTILO WHATSAPP ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = "pt-BR";
        recognition.interimResults = true;

        let isListening = false;
        mic.addEventListener("click", () => {
            if (!isListening) {
                recognition.start();
            } else {
                recognition.stop();
            }
        });

        recognition.onstart = () => {
            isListening = true;
            mic.classList.add("listening");
            mic.textContent = "■";
            statusEl.textContent = "Ouvindo... fale agora";
            input.placeholder = "Ouvindo...";
        };
        recognition.onend = () => {
            isListening = false;
            mic.classList.remove("listening");
            mic.textContent = "🎤";
            statusEl.textContent = "";
            input.placeholder = "Digite sua mensagem...";
            if(input.value.trim()) sendMessage();
        };
        recognition.onresult = (event) => {
            const transcript = Array.from(event.results).map(r => r[0].transcript).join("");
            input.value = transcript;
            if (transcript.trim()) {
                mic.style.display = "none";
                send.style.display = "flex";
            }
        };
    } else {
        mic.addEventListener("click", () => alert("Seu iPhone não liberou o microfone no site. Use o microfone do teclado por enquanto."))
    }

    addMessage("Olá! Eu sou a Z. Como posso ajudar?", "assistant");
</script>
</body>
</html>
