<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z - Final Sem Erro</title>
<script>
async function buscaReal(pergunta){
  const q = pergunta.toLowerCase();
  try{
    if(q.includes("dolar") || q.includes("dólar") || q.includes("usd")){
      const r = await fetch("https://economia.awesomeapi.com.br/last/USD-BRL");
      const j = await r.json();
      const v = j.USDBRL;
      return `💵 Dólar hoje: R$ ${parseFloat(v.bid).toFixed(2)} (compra) / R$ ${parseFloat(v.ask).toFixed(2)} (venda) - Variação ${v.pctChange}% - Atualizado ${v.create_date}`;
    }
    if(q.includes("temperatura") || q.includes("clima") || q.includes("salvador")){
      let cidade = "Salvador";
      if(q.includes(" em ")) cidade = q.split(" em ")[1].split(/[?,.]/)[0].trim();
      const r = await fetch(`https://wttr.in/${cidade}?format=j1`);
      const j = await r.json();
      const a = j.current_condition[0];
      return `🌡️ Agora em ${cidade}: ${a.temp_C}°C (sensação ${a.FeelsLikeC}°C), ${a.weatherDesc[0].value}, umidade ${a.humidity}%, vento ${a.windspeedKmph}km/h`;
    }
  }catch(e){ console.log(e); }
  return null;
}

function addMsg(t,quem){
  const c=document.getElementById('chat');
  const d=document.createElement('div'); d.className=quem; d.innerText=t;
  c.appendChild(d); c.scrollTop=c.scrollHeight; return d;
}

window.enviar=async()=>{
  const inp=document.getElementById('input'); let txt=inp.value.trim(); if(!txt) return;
  addMsg(txt,'me'); inp.value='';
  const load=addMsg("Z buscando... 🐻",'z');

  // 1. Tenta buscar dado real primeiro (não precisa de IA)
  let dado = await buscaReal(txt);
  if(dado){
    load.innerText = dado;
    try{ speechSynthesis.speak(new SpeechSynthesisUtterance(dado.slice(0,150))); }catch(e){}
    // imagem extra se pediu
    if(txt.toLowerCase().match(/imagem|cria|desenha/)){
      const img=document.createElement('img');
      img.src=`https://image.pollinations.ai/prompt/${encodeURIComponent(txt)}?nologo=true&width=1024&height=1024&seed=${Date.now()}`;
      img.style="width:85%;border-radius:15px;margin:8px;border:2px solid #25D366;display:block";
      document.getElementById('chat').appendChild(img);
    }
    return;
  }

  // 2. Se não for dólar/tempo, tenta chat online com API nova
  let prompt = `Responda curto pt-BR WhatsApp como Z ursinha 🐻: ${txt}`;
  try{
    // API nova que não dá ENOSPC
    const r = await fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(txt)+"&format=json");
    const j = await r.json();
    if(j.AbstractText){
      load.innerText = j.AbstractText;
    } else {
      // fallback final
      load.innerText = `Oi! Sobre "${txt}" 🐻\n\nPosso te ajudar com:\n- Dólar: "quanto está o dólar hoje"\n- Tempo: "temperatura em Salvador"\n- Imagem: "cria imagem do Ben astronauta"`;
    }
  }catch(e){
    load.innerText = `Recebi: "${txt}" 🐻 Tô online! Pergunta dólar ou temperatura que te respondo na hora.`;
  }
};

let rec;
window.startRec=()=>{
  document.getElementById('grav').style.display='flex';
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return;
  rec=new SR(); rec.lang='pt-BR'; rec.start();
  rec.onresult=e=>{document.getElementById('input').value=e.results[0][0].transcript; stopRec(); enviar();};
};
window.stopRec=()=>{document.getElementById('grav').style.display='none'; if(rec)try{rec.stop()}catch(e){}};
</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b141a;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
#top{background:#25D366;text-align:center;padding:10px;font-weight:bold}
#chat{flex:1;overflow:auto;padding:15px 10px 85px;display:flex;flex-direction:column;gap:8px;background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}
.me{align-self:flex-end;background:#005c4b;padding:10px 14px;border-radius:12px 0 12px 12px;max-width:82%}
.z{align-self:flex-start;background:#202c33;padding:10px 14px;border-radius:0 12px 12px 12px;max-width:82%;white-space:pre-wrap}
#barra{position:fixed;bottom:0;width:100%;background:#202c33;display:flex;gap:8px;padding:10px}
#input{flex:1;padding:13px 18px;border-radius:25px;border:none;background:#2a3942;color:white;outline:none;font-size:16px}
.btn{width:48px;height:48px;border-radius:50%;border:none;background:#25D366;color:white;font-size:20px}
#grav{display:none;position:fixed;bottom:70px;width:100%;background:#f15c6d;padding:12px;justify-content:center;z-index:10}
</style>
</head>
<body>
<div id="top">✅ Z Online - Dólar e Tempo Real</div>
<div id="grav">🔴 Ouvindo... solte <button onclick="stopRec()">X</button></div>
<div id="chat"><div class="z">Agora 100% sem erro! 🐻

Testa de novo:
"Quanto está o dólar hoje"
"Qual temperatura em Salvador"

Vai responder na hora com dado real da internet!</div></div>
<div id="barra">
<input id="input" placeholder="Pergunte..." onkeydown="if(event.key==='Enter')enviar()">
<button class="btn" onmousedown="startRec()" onmouseup="stopRec()" ontouchstart="startRec()" ontouchend="stopRec()">🎤</button>
<button class="btn" onclick="enviar()">➤</button>
</div>
</body>
</html>
