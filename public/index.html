<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z - Sua IA pessoal OFFLINE</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:white;height:100vh}
.app{height:100vh;display:flex;flex-direction:column}
header{padding:12px;text-align:center;border-bottom:1px solid #334155}
#statusTop{font-size:12px;padding:6px;text-align:center}
.online{color:#4ade80;background:#052e16}.offline{color:#fbbf24;background:#451a03}
#chat{flex:1;overflow-y:auto;padding:20px}
.message{margin-bottom:14px;padding:12px 15px;border-radius:14px;max-width:85%;white-space:pre-wrap;line-height:1.5}
.user{margin-left:auto;background:#2563eb}.assistant{margin-right:auto;background:#1e293b}
.input-area{display:flex;gap:10px;padding:15px;border-top:1px solid #334155;align-items:center}
input{flex:1;padding:16px 20px;border:none;border-radius:25px;font-size:16px;outline:none}
.btn{width:52px;height:52px;min-width:52px;border:none;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center}
#send{background:#25D366;color:white} #mic{background:#2563eb;color:white}
#loadBar{padding:10px;text-align:center;font-size:13px;display:none}
</style>
<script type="importmap">
{ "imports": { "@mlc-ai/web-llm": "https://esm.run/@mlc-ai/web-llm@0.2.61" } }
</script>
</head>
<body>
<div class="app">
<header><div style="font-size:22px;font-weight:bold">Z</div><div id="statusTop" class="online">● Online - Z completa</div></header>
<div id="loadBar">📥 Baixando Z offline pela 1ª vez... <span id="loadPct">0%</span><br><small>Depois disso ela funciona sem internet</small></div>
<div id="chat"></div>
<div class="input-area">
<input id="message" type="text" placeholder="Digite sua mensagem..." autocomplete="off">
<button id="mic" class="btn">🎤</button>
<button id="send" class="btn">➤</button>
</div>
</div>
<script type="module">
import * as webllm from "@mlc-ai/web-llm";
const chat=document.getElementById("chat"), input=document.getElementById("message"), sendBtn=document.getElementById("send"), mic=document.getElementById("mic"), statusTop=document.getElementById("statusTop"), loadBar=document.getElementById("loadBar"), loadPct=document.getElementById("loadPct");
let history=[], engine=null, offlineReady=false;

function addMsg(t,r){const d=document.createElement("div");d.className="message "+r;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}

async function initOffline(){
 try{
  loadBar.style.display="block";
  engine=await webllm.CreateMLCEngine("Llama-3.2-1B-Instruct-q4f32_1-MLC",{
   initProgressCallback:(p)=>{loadPct.textContent=Math.round(p.progress*100)+"%"; if(p.text)console.log(p.text)}
  });
  offlineReady=true; loadBar.style.display="none"; addMsg("✅ Z offline instalada! Agora posso funcionar sem internet também.","assistant");
 }catch(e){loadBar.textContent="Erro ao baixar offline: "+e.message}
}
initOffline();

function updateOnlineStatus(){
 if(navigator.onLine){statusTop.className="online"; statusTop.textContent="● Online - Z completa"}else{statusTop.className="offline"; statusTop.textContent="● Offline - Z local (sem internet)"}
}
window.addEventListener("online",updateOnlineStatus); window.addEventListener("offline",updateOnlineStatus); updateOnlineStatus();

async function sendMessage(){
 const m=input.value.trim(); if(!m) return;
 addMsg(m,"user"); history.push({role:"user",content:m}); input.value="";
 if(navigator.onLine){
  try{
   const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m,history})});
   const d=await r.json(); addMsg(d.reply,"assistant"); history.push({role:"assistant",content:d.reply}); return;
  }catch(e){ console.log("Falhou online, tentando offline", e)}
 }
 // MODO OFFLINE
 if(!offlineReady){ addMsg("Ainda estou baixando a versão offline... aguarde 1 min e tente de novo (precisa de internet só essa primeira vez).","assistant"); return; }
 try{
  const msgs=[{role:"system",content:"Você é a Z, assistente pessoal, responda em português, curta e direta."},...history];
  let reply=""; const stream=await engine.chat.completions.create({stream:true,messages:msgs,temperature:0.7});
  const div=document.createElement("div"); div.className="message assistant"; chat.appendChild(div);
  for await(const chunk of stream){ const delta=chunk.choices[0]?.delta?.content||""; reply+=delta; div.textContent=reply; chat.scrollTop=chat.scrollHeight; }
  history.push({role:"assistant",content:reply});
 }catch(e){addMsg("Erro offline: "+e.message,"assistant")}
}
sendBtn.addEventListener("click",sendMessage);
input.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});

// MIC simples offline também funciona (voz -> texto precisa internet, mas texto -> resposta funciona offline)
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const rec=new SR();rec.lang="pt-BR";let grav=false;rec.onresult=e=>{input.value=e.results[0][0].transcript};rec.onend=()=>{if(grav){sendMessage()} grav=false; mic.textContent="🎤"}; mic.addEventListener("click",()=>{if(!grav){rec.start();grav=true;mic.textContent="■"}else{rec.stop()}});}

addMsg("Olá! Eu sou a Z. Agora com modo OFFLINE! Primeira vez precisa baixar (800MB). Depois funciona sem internet.","assistant");
</script>
</body>
</html>
