<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z - Sua IA pessoal</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:white;height:100vh}
.app{height:100vh;display:flex;flex-direction:column}
header{padding:18px;text-align:center;border-bottom:1px solid #334155;font-size:24px;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:20px}
.message{margin-bottom:14px;padding:12px 15px;border-radius:14px;max-width:85%;white-space:pre-wrap;line-height:1.5}
.user{margin-left:auto;background:#2563eb}.assistant{margin-right:auto;background:#1e293b}
.input-area{position:relative;display:flex;gap:10px;padding:15px;border-top:1px solid #334155;align-items:center;background:#0f172a}
input{flex:1;padding:14px;border:none;border-radius:25px;font-size:16px;outline:none}
#send{width:50px;height:50px;border:none;border-radius:50%;background:#2563eb;color:white;font-size:22px;display:none;align-items:center;justify-content:center}
#mic{width:50px;height:50px;border:none;border-radius:50%;background:#2563eb;color:white;font-size:22px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
#mic.recording{background:#ef4444;transform:scale(1.15)}
#recOverlay{display:none;position:absolute;left:15px;right:75px;bottom:15px;background:#1e293b;border-radius:25px;padding:14px 18px;align-items:center;gap:12px}
#recOverlay.show{display:flex}
.dot{width:10px;height:10px;background:#ef4444;border-radius:50%;animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
#timer{font-size:15px}
#hint{margin-left:auto;font-size:12px;color:#94a3b8}
#lockHint{position:absolute;bottom:80px;right:20px;background:#1e293b;padding:10px 14px;border-radius:12px;font-size:13px;display:none;align-items:center;gap:6px;border:1px solid #334155}
#lockHint.show{display:flex}
.cancelHint{position:absolute;left:20px;bottom:80px;background:#1e293b;padding:10px 14px;border-radius:12px;font-size:13px;display:none;border:1px solid #334155}
.cancelHint.show{display:flex}
</style>
</head>
<body>
<div class="app">
<header>Z</header>
<div id="chat"></div>
<div class="input-area" id="inputArea">
  <div id="recOverlay"><div class="dot"></div><span id="timer">0:00</span><span id="hint">Deslize para cancelar ◀</span></div>
  <div id="lockHint">🔒 Deslize pra cima para travar</div>
  <div class="cancelHint" id="cancelHint">🗑️ Solte para cancelar</div>
  <input id="message" type="text" placeholder="Digite sua mensagem..." autocomplete="off">
  <button id="mic">🎤</button>
  <button id="send">➤</button>
</div>
</div>
<script>
const chat=document.getElementById("chat"), input=document.getElementById("message"), send=document.getElementById("send"), mic=document.getElementById("mic");
const recOverlay=document.getElementById("recOverlay"), timerEl=document.getElementById("timer"), lockHint=document.getElementById("lockHint"), cancelHint=document.getElementById("cancelHint");
const history=[];
function addMessage(t,r){const d=document.createElement("div");d.className="message "+r;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
input.addEventListener("input",()=>{if(input.value.trim()){mic.style.display="none";send.style.display="flex"}else{mic.style.display="flex
